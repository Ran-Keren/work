<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Schedule Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e2937;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        header { text-align: center; margin-bottom: 1.5rem; }
        h2 { margin: 0; color: var(--primary); font-size: 1.6rem; font-weight: 800; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 700; margin-bottom: 0.5rem; font-size: 0.9rem; }

        input, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
            background: white;
        }

        .days-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 16px;
            margin-bottom: 1.2rem;
        }

        .day-item {
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .day-item label { font-size: 0.8rem; margin-bottom: 3px; color: #64748b; }
        .day-item select { padding: 0.4rem; font-size: 0.9rem; border: 1px solid var(--border); }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; }

        .status-msg {
            margin-top: 1rem;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <header>
        <h2>Weekly Schedule Editor</h2>
    </header>

    <form id="scheduleForm">
        <div class="form-group">
            <label for="employeeName">Select / Type Employee Name</label>
            <div style="display: flex; gap: 8px;">
                <input type="text" id="employeeName" list="namesList" placeholder="Type name..." required>
                <button type="button" id="loadBtn" style="width: 130px; margin-top: 0; padding: 0.5rem; font-size: 0.95rem;">Load Data</button>
            </div>
            <datalist id="namesList">
                <!-- Add your employee names here matching Column A -->
                <option value="אור שמונוב">
                <option value="אורטל פיטוסי">
                <option value="אייל ח'יר">
            </datalist>
        </div>

        <div class="days-grid">
            <div class="day-item">
                <label>Sunday</label>
                <select id="sun">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
            <div class="day-item">
                <label>Monday</label>
                <select id="mon">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
            <div class="day-item">
                <label>Tuesday</label>
                <select id="tue">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
            <div class="day-item">
                <label>Wednesday</label>
                <select id="wed">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
            <div class="day-item">
                <label>Thursday</label>
                <select id="thu">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
            <div class="day-item">
                <label>Friday</label>
                <select id="fri">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
            <div class="day-item" style="grid-column: span 2;">
                <label>Saturday</label>
                <select id="sat">
                    <option value="">-- Choose --</option>
                    <option value="Option 1">Option 1</option>
                    <option value="Option 2">Option 2</option>
                    <option value="Option 3">Option 3</option>
                </select>
            </div>
        </div>

        <button type="submit" id="submitBtn">Save Changes</button>
    </form>
    <div id="status" class="status-msg"></div>
</div>

<script>
    // Paste your Web App deployment URL here
    const scriptURL = 'YOUR_GOOGLE_SCRIPT_URL_HERE';

    const form = document.getElementById('scheduleForm');
    const loadBtn = document.getElementById('loadBtn');
    const submitBtn = document.getElementById('submitBtn');
    const status = document.getElementById('status');

    // Load existing choices when clicking "Load Data"
    loadBtn.onclick = async () => {
        const employee = document.getElementById('employeeName').value.trim();
        if (!employee) {
            alert('Please enter or select an employee name first.');
            return;
        }

        loadBtn.disabled = true;
        loadBtn.innerText = 'Loading...';
        status.style.display = 'none';

        try {
            const response = await fetch(`${scriptURL}?employee=${encodeURIComponent(employee)}`);
            const result = await response.json();

            if (result.status === 'success' && result.schedule) {
                document.getElementById('sun').value = result.schedule.sun || '';
                document.getElementById('mon').value = result.schedule.mon || '';
                document.getElementById('tue').value = result.schedule.tue || '';
                document.getElementById('wed').value = result.schedule.wed || '';
                document.getElementById('thu').value = result.schedule.thu || '';
                document.getElementById('fri').value = result.schedule.fri || '';
                document.getElementById('sat').value = result.schedule.sat || '';

                status.style.display = 'block';
                status.style.color = '#166534';
                status.style.backgroundColor = '#dcfce7';
                status.innerText = '✓ Data loaded successfully!';
            } else {
                ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].forEach(day => {
                    document.getElementById(day).value = '';
                });
                status.style.display = 'block';
                status.style.color = '#991b1b';
                status.style.backgroundColor = '#fee2e2';
                status.innerText = 'Employee not found in sheet.';
            }
        } catch (error) {
            status.style.display = 'block';
            status.style.color = '#991b1b';
            status.style.backgroundColor = '#fee2e2';
            status.innerText = 'Error loading data.';
        } finally {
            loadBtn.disabled = false;
            loadBtn.innerText = 'Load Data';
        }
    };

    // Update existing row when clicking "Save Changes"
    form.onsubmit = async (e) => {
        e.preventDefault();

        const employee = document.getElementById('employeeName').value.trim();
        if (!employee) {
            alert('Please enter an employee name.');
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = 'Saving...';
        status.style.display = 'none';

        const payload = {
            employee: employee,
            schedule: {
                sun: document.getElementById('sun').value,
                mon: document.getElementById('mon').value,
                tue: document.getElementById('tue').value,
                wed: document.getElementById('wed').value,
                thu: document.getElementById('thu').value,
                fri: document.getElementById('fri').value,
                sat: document.getElementById('sat').value
            }
        };

        try {
            await fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify(payload)
            });

            status.style.display = 'block';
            status.style.color = '#166534';
            status.style.backgroundColor = '#dcfce7';
            status.innerText = '✓ Changes saved successfully!';
        } catch (error) {
            status.style.display = 'block';
            status.style.color = '#991b1b';
            status.style.backgroundColor = '#fee2e2';
            status.innerText = 'Error saving changes';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Save Changes';
        }
    };
</script>

</body>
</html>
