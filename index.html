<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>דיווח משמרות שבועי</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100%;
            margin: 0 auto;
            padding: 8px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .view {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            height: 100%;
        }

        .hidden {
            display: none !important;
        }

        .info-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
            z-index: 10;
        }

        .info-btn:active {
            transform: scale(0.95);
        }

        .header-section {
            background: #ffffff;
            padding: 8px 10px;
            border-radius: 10px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        h1 {
            font-size: 1.05rem;
            text-align: center;
            margin-bottom: 2px;
            color: #0f172a;
            font-weight: 700;
        }

        .week-subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        select {
            width: 100%;
            height: 38px;
            padding: 0 10px;
            font-size: 0.95rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            background-color: #f8fafc;
            appearance: none;
            outline: none;
            font-weight: 600;
            color: #334155;
        }

        select:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
        }

        .select-wrapper::after {
            content: '\f078';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #64748b;
            font-size: 0.75rem;
        }

        .loading-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 18px;
            margin-top: 2px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid #e2e8f0;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .days-container {
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            flex-grow: 1;
            margin: 6px 0;
        }

        .day-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            padding: 6px 12px;
            border-bottom: 1px solid #f1f5f9;
            flex-grow: 1;
        }

        .day-row:last-child {
            border-bottom: none;
        }

        .day-label {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
        }

        .options-group {
            display: flex;
            gap: 6px;
            justify-content: flex-end;
        }

        .opt-btn {
            width: 50px;
            height: 34px;
            border-radius: 6px;
            border: 1px solid #cbd5e1;
            background-color: #f8fafc;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        .opt-btn.office.active {
            background-color: #eff6ff;
            border-color: #3b82f6;
            color: #2563eb;
        }

        .opt-btn.home.active {
            background-color: #f0fdf4;
            border-color: #22c55e;
            color: #16a34a;
        }

        .opt-btn.night.active {
            background-color: #f5f3ff;
            border-color: #8b5cf6;
            color: #7c3aed;
        }

        .opt-btn.home.restricted {
            border-color: #ef4444;
            color: #ef4444;
            background-color: #fef2f2;
        }

        .opt-btn.home.restricted.active {
            background-color: #fff7ed;
            border-color: #f97316;
            color: #f97316;
        }

        .footer-section {
            width: 100%;
        }

        .submit-btn {
            width: 100%;
            height: 42px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
        }

        /* Info Page View */
        .info-card {
            background: #ffffff;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
            margin: 6px 0;
            overflow: hidden;
        }

        .info-header-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: #0f172a;
            text-align: center;
        }

        .info-section-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: #2563eb;
            background-color: #eff6ff;
            padding: 3px 6px;
            border-radius: 4px;
            text-align: center;
            margin-top: 2px;
            margin-bottom: 2px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2px 0;
            border-bottom: 1px solid #f8fafc;
            font-size: 0.78rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #64748b;
        }

        .info-val-group {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .info-val {
            font-weight: 700;
            color: #0f172a;
        }

        .target-badge {
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 3px;
            font-weight: 600;
        }

        .target-badge.yes {
            background-color: #f0fdf4;
            color: #16a34a;
        }

        .target-badge.no {
            background-color: #fef2f2;
            color: #ef4444;
        }

        .back-btn {
            width: 100%;
            height: 42px;
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Main View -->
        <div id="mainView" class="view">
            <button class="info-btn" id="infoBtn" onclick="openInfoPage()" title="מידע על העובד">
                <i class="fa-solid fa-list"></i>
            </button>

            <div class="header-section">
                <h1>דיווח משמרות לשבוע הבא</h1>
                <div class="week-subtitle" id="weekDatesRange"></div>
                <div class="select-wrapper">
                    <select id="employeeName" onchange="fetchEmployeeSchedule()">
                        <option value="" disabled selected>-- בחר שם עובד --</option>
                        <option value="Angolina Mattar">Angolina Mattar</option>
                        <option value="Carlos Salloum">Carlos Salloum</option>
                        <option value="Johaina Swaed">Johaina Swaed</option>
                        <option value="Mahdi Zoabi">Mahdi Zoabi</option>
                        <option value="Mai Zbedat">Mai Zbedat</option>
                        <option value="Malak Sabbah">Malak Sabbah</option>
                        <option value="Maya Haddad">Maya Haddad</option>
                        <option value="Or Shomonov">Or Shomonov</option>
                        <option value="Ortal Fitoussi">Ortal Fitoussi</option>
                        <option value="Pearla Deek">Pearla Deek</option>
                        <option value="Rafael Simanduev">Rafael Simanduev</option>
                        <option value="Rula Darawshi">Rula Darawshi</option>
                        <option value="Sally Gharzuzi">Sally Gharzuzi</option>
                        <option value="Shmuel Tetruashvili">Shmuel Tetruashvili</option>
                        <option value="Suhail Mustafa">Suhail Mustafa</option>
                        <option value="Yazan kezil">Yazan kezil</option>
                        <option value="Arifenur Uslu">Arifenur Uslu</option>
                        <option value="Jwana Qassis">Jwana Qassis</option>
                        <option value="Kathryn Bachishche">Kathryn Bachishche</option>
                        <option value="Mais Abed Elrhman">Mais Abed Elrhman</option>
                        <option value="Mohamad Shaheen">Mohamad Shaheen</option>
                        <option value="Tehila Nava Ben Hayoun">Tehila Nava Ben Hayoun</option>
                        <option value="Youssef Daoud">Youssef Daoud</option>
                    </select>
                </div>
                <div class="loading-container">
                    <div id="loadingSpinner" class="spinner hidden"></div>
                </div>
            </div>

            <div class="days-container" id="daysContainer"></div>

            <div class="footer-section">
                <button class="submit-btn" id="submitBtn" onclick="submitData()">שמור נתונים</button>
            </div>
        </div>

        <!-- Info Page View -->
        <div id="infoView" class="view hidden">
            <div class="header-section">
                <div class="info-header-title" id="infoTitle">פרטי עובד</div>
            </div>
            <div class="info-card" id="infoContent">
                <div style="text-align: center; color: #64748b; font-size: 0.85rem;">טוען נתונים...</div>
            </div>
            <div class="footer-section">
                <button class="back-btn" onclick="goBackToMain()">חזרה לדיווח משמרות</button>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwX4E_lVTSG8KEYlddLimtyS-Gz13O_folJqP-2V5vZL0z2dg69vpPM_TyCteSkzOz28w/exec';
        let isLoading = false;
        let cachedInfoData = null;

        function initWeekDates() {
            const now = new Date();
            const dayOfWeek = now.getDay(); 
            const sunday = new Date(now);
            sunday.setDate(now.getDate() - dayOfWeek);
            
            const saturday = new Date(sunday);
            saturday.setDate(sunday.getDate() + 6);
            
            const formatDate = (d) => `${d.getDate()}.${d.getMonth() + 1}`;
            document.getElementById('weekDatesRange').innerText = `${formatDate(sunday)}-${formatDate(saturday)}`;
        }
        initWeekDates();

        const days = [
            { name: "ראשון", id: "sunday" },
            { name: "שני", id: "monday" },
            { name: "שלישי", id: "tuesday" },
            { name: "רביעי", id: "wednesday" },
            { name: "חמישי", id: "thursday" },
            { name: "שישי", id: "friday" },
            { name: "שבת", id: "saturday" }
        ];

        const container = document.getElementById('daysContainer');

        days.forEach(day => {
            const row = document.createElement('div');
            row.className = 'day-row';
            row.innerHTML = `
                <span class="day-label">${day.name}</span>
                <div class="options-group" data-day="${day.id}">
                    <button type="button" class="opt-btn office" onclick="selectOption('${day.id}', 'office')" title="עובד מהמשרד">
                        <i class="fa-solid fa-building"></i>
                    </button>
                    <button type="button" class="opt-btn home" onclick="selectOption('${day.id}', 'home')" title="עובד מהבית">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <button type="button" class="opt-btn night" onclick="selectOption('${day.id}', 'night')" title="משמרת לילה">
                        <i class="fa-solid fa-moon"></i>
                    </button>
                </div>
            `;
            container.appendChild(row);
        });

        const schedule = {};

        function resetUI() {
            days.forEach(day => {
                const group = document.querySelector(`[data-day="${day.id}"]`);
                if (group) {
                    const buttons = group.querySelectorAll('.opt-btn');
                    buttons.forEach(btn => btn.classList.remove('active'));
                }
            });
            for (let key in schedule) {
                delete schedule[key];
            }
            cachedInfoData = null;
        }

        function setHomeButtonRestricted(isRestricted) {
            document.querySelectorAll('.opt-btn.home').forEach(btn => {
                if (isRestricted) {
                    btn.classList.add('restricted');
                } else {
                    btn.classList.remove('restricted');
                }
            });
        }

        async function fetchEmployeeSchedule() {
            const name = document.getElementById('employeeName').value;
            if (!name) return;

            document.getElementById('infoBtn').style.display = 'none';

            isLoading = true;
            resetUI();
            setHomeButtonRestricted(false);
            
            const spinner = document.getElementById('loadingSpinner');
            spinner.classList.remove('hidden');

            try {
                const response = await fetch(`${scriptURL}?employee=${encodeURIComponent(name)}`);
                const result = await response.json();
                
                if (result.restricted === true || String(result.colB).trim() === "לא") {
                    setHomeButtonRestricted(true);
                }

                if (result.info) {
                    cachedInfoData = result.info;
                }

                if (result.status === 'success' && result.schedule) {
                    for (const [dayId, type] of Object.entries(result.schedule)) {
                        if (type) {
                            const group = document.querySelector(`[data-day="${dayId}"]`);
                            if (group) {
                                const selectedBtn = group.querySelector(`.${type}`);
                                if (selectedBtn) {
                                    selectedBtn.classList.add('active');
                                    const textMap = { 'office': 'משרד', 'home': 'בית', 'night': 'ערב' };
                                    schedule[dayId] = textMap[type];
                                }
                            }
                        }
                    }
                }

                document.getElementById('infoBtn').style.display = 'flex';

            } catch (error) {
                console.error('Error fetching schedule:', error);
            } finally {
                spinner.classList.add('hidden');
                isLoading = false;
            }
        }

        function selectOption(dayId, type) {
            if (isLoading) return;

            const name = document.getElementById('employeeName').value;
            if (!name) {
                alert('אנא בחר שם עובד תחילה');
                return;
            }

            const textMap = {
                'office': 'משרד',
                'home': 'בית',
                'night': 'ערב'
            };

            const val = textMap[type];
            const group = document.querySelector(`[data-day="${dayId}"]`);
            const buttons = group.querySelectorAll('.opt-btn');
            const selectedBtn = group.querySelector(`.${type}`);
            const isCurrentlyActive = selectedBtn.classList.contains('active');

            buttons.forEach(btn => btn.classList.remove('active'));
            
            if (!isCurrentlyActive) {
                selectedBtn.classList.add('active');
                schedule[dayId] = val;
            } else {
                delete schedule[dayId];
            }
        }

        async function submitData() {
            if (isLoading) return;

            const name = document.getElementById('employeeName').value;
            if (!name) {
                alert('אנא בחר שם עובד לפני השמירה');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = 'שומר...';

            let url = `${scriptURL}?action=save&employee=${encodeURIComponent(name)}`;
            days.forEach(day => {
                if (schedule[day.id]) {
                    url += `&${day.id}=${encodeURIComponent(schedule[day.id])}`;
                }
            });

            try {
                await fetch(url);
            } catch (error) {
                console.error('Error submitting data:', error);
                alert('שגיאה בשמירת הנתונים');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'שמור נתונים';
            }
        }

        function openInfoPage() {
            const name = document.getElementById('employeeName').value;
            if (!name) return;

            document.getElementById('mainView').classList.add('hidden');
            document.getElementById('infoView').classList.remove('hidden');
            document.getElementById('infoTitle').innerText = `פרטי עובד: ${name}`;
            
            const infoContainer = document.getElementById('infoContent');
            
            if (!cachedInfoData) {
                infoContainer.innerHTML = `<div style="text-align: center; color: #64748b; font-size: 0.85rem;">לא נמצאו נתונים עבור עובד זה.</div>`;
                return;
            }

            const formatValueAsPercentage = (val) => {
                if (val === undefined || val === null) return '';
                const clean = String(val).trim();
                const num = parseFloat(clean);
                if (!isNaN(num) && num <= 1 && num >= 0) {
                    return `${Math.round(num * 100)}%`;
                }
                return clean;
            };

            const formatValueAsMinutes = (val) => {
                if (val === undefined || val === null) return '';
                const clean = String(val).trim();
                const num = parseFloat(clean);
                if (!isNaN(num)) {
                    return `${num} דקות`;
                }
                return clean;
            };

            const renderBadge = (val) => {
                if (val === undefined || val === null) return '';
                const clean = String(val).trim();
                const isYes = clean === '✓' || clean.toLowerCase() === 'כן' || clean.toLowerCase() === 'yes';
                const isNo = clean === '✗' || clean.toLowerCase() === 'לא' || clean.toLowerCase() === 'no';
                
                let badgeClass = 'no';
                if (isYes) badgeClass = 'yes';
                else if (isNo) badgeClass = 'no';

                let displayVal = clean;
                if (isYes && displayVal === '✓') displayVal = '✓';
                if (isNo && displayVal === '✗') displayVal = '✗';

                return `<span class="target-badge ${badgeClass}">${displayVal}</span>`;
            };

            const cur = cachedInfoData; 
            const prev = cachedInfoData.prevMonth || {};
            const older = cachedInfoData.twoMonthsAgo || {};

            let htmlContent = `
                <div class="info-section-title">שבוע נוכחי</div>
                <div class="info-row">
                    <span class="info-label">דירוג לקוחות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsPercentage(cur.customerRating)}</span>
                        ${renderBadge(cur.customerRatingTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">דירוג מסעדות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsPercentage(cur.restaurantRating)}</span>
                        ${renderBadge(cur.restaurantRatingTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">משך שיחה לקוחות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsMinutes(cur.customerCallDur)}</span>
                        ${renderBadge(cur.customerCallDurTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">משך שיחה מסעדות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsMinutes(cur.restaurantCallDur)}</span>
                        ${renderBadge(cur.restaurantCallDurTarget)}
                    </div>
                </div>

                <div class="info-section-title">חודש קודם</div>
                <div class="info-row">
                    <span class="info-label">דירוג לקוחות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsPercentage(prev.customerRating)}</span>
                        ${renderBadge(prev.customerRatingTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">דירוג מסעדות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsPercentage(prev.restaurantRating)}</span>
                        ${renderBadge(prev.restaurantRatingTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">משך שיחה לקוחות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsMinutes(prev.customerCallDur)}</span>
                        ${renderBadge(prev.customerCallDurTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">משך שיחה מסעדות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsMinutes(prev.restaurantCallDur)}</span>
                        ${renderBadge(prev.restaurantCallDurTarget)}
                    </div>
                </div>

                <div class="info-section-title">לפני חודשיים</div>
                <div class="info-row">
                    <span class="info-label">דירוג לקוחות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsPercentage(older.customerRating)}</span>
                        ${renderBadge(older.customerRatingTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">דירוג מסעדות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsPercentage(older.restaurantRating)}</span>
                        ${renderBadge(older.restaurantRatingTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">משך שיחה לקוחות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsMinutes(older.customerCallDur)}</span>
                        ${renderBadge(older.customerCallDurTarget)}
                    </div>
                </div>
                <div class="info-row">
                    <span class="info-label">משך שיחה מסעדות:</span>
                    <div class="info-val-group">
                        <span class="info-val">${formatValueAsMinutes(older.restaurantCallDur)}</span>
                        ${renderBadge(older.restaurantCallDurTarget)}
                    </div>
                </div>
            `;

            infoContainer.innerHTML = htmlContent;
        }

        function goBackToMain() {
            document.getElementById('infoView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
        }

        document.addEventListener('touchmove', function (e) {
            if (e.scale !== 1) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
