<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת דיווחים</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e2937;
            --text-sub: #64748b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Assistant', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .card {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        header { text-align: center; margin-bottom: 1.5rem; }
        h2 { margin: 0; color: var(--primary); font-size: 1.6rem; font-weight: 800; }

        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 700; margin-bottom: 0.5rem; font-size: 0.9rem; }

        input, textarea, select {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 1rem;
            box-sizing: border-box;
            font-family: inherit;
        }

        .category-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background: #f1f5f9;
            padding: 12px;
            border-radius: 16px;
        }

        .chip {
            cursor: pointer;
            padding: 10px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chip input { display: none; }

        .chip:has(input:checked) {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1rem;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) { background-color: var(--primary-hover); }
        button:disabled { background-color: #cbd5e1; }

        .status-msg {
            margin-top: 1rem;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            display: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="card">
    <header>
        <h2>דיווח נתונים</h2>
    </header>

    <form id="sheetForm">
        <div class="form-group">
            <label for="date">תאריך</label>
            <input type="date" id="date" required>
        </div>
        
        <div class="form-group">
            <label for="agentName">שם הנציג/ה</label>
            <select id="agentName" required>
                <option value="" disabled selected>טוען נציגים מהגיליון...</option>
            </select>
        </div>

        <div class="form-group">
            <label>קטגוריות</label>
            <div class="category-container">
                <label class="chip"><input type="checkbox" name="category" value="חיובי">חיובי</label>
                <label class="chip"><input type="checkbox" name="category" value="משמעת">משמעת</label>
                <label class="chip"><input type="checkbox" name="category" value="מקצועי">מקצועי</label>
                <label class="chip"><input type="checkbox" name="category" value="איחור">איחור</label>
                <label class="chip"><input type="checkbox" name="category" value="חוסר">חוסר</label>
                <label class="chip"><input type="checkbox" name="category" value="התנהלות">התנהלות</label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="description">תיאור המקרה</label>
            <textarea id="description" rows="3" placeholder="פרט כאן..."></textarea>
        </div>

        <div class="form-group">
            <label for="link">קישור</label>
            <input type="url" id="link" placeholder="https://...">
        </div>

        <div class="form-group">
            <label for="statusInput">סטטוס / טיפול</label>
            <input type="text" id="statusInput" placeholder="מה בוצע?">
        </div>
        
        <button type="submit" id="submitBtn">שלח עדכון</button>
    </form>
    <div id="status" class="status-msg"></div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz2cMrxFuQdghae_RVFmLnpUEdwD0BaGc40DZQ448v2gmjvmwxu9azT4H5KMlNhSd56/exec';
    
    let sheetDataCache = [];
    const daysMap = ['יום ראשון', 'יום שני', 'יום שלישי', 'יום רביעי', 'יום חמישי', 'יום שישי', 'יום שבת'];

    document.getElementById('date').valueAsDate = new Date();

    const form = document.getElementById('sheetForm');
    const btn = document.getElementById('submitBtn');
    const statusMsg = document.getElementById('status');
    const agentSelect = document.getElementById('agentName');
    const dateInput = document.getElementById('date');

    // Load data directly from Google Spreadsheet
    async function loadSheetData() {
        try {
            const res = await fetch(scriptURL);
            sheetDataCache = await res.json();
            populateAgentDropdown();
            updateSelectedOption();
        } catch (err) {
            console.error('Error fetching sheet data:', err);
            agentSelect.innerHTML = '<option value="" disabled>שגיאה שטעינת הנתונים</option>';
        }
    }

    function populateAgentDropdown() {
        agentSelect.innerHTML = '<option value="" disabled selected>בחר נציג/ה...</option>';
        sheetDataCache.forEach(row => {
            if (row.name) {
                const opt = document.createElement('option');
                opt.value = row.name;
                opt.textContent = row.name;
                agentSelect.appendChild(opt);
            }
        });
    }

    // Lookup corresponding cell based on selected Name and Date (Day of the week)
    function updateSelectedOption() {
        const selectedName = agentSelect.value;
        const rawDate = dateInput.value;

        if (!selectedName || !rawDate) return;

        const dateObj = new Date(rawDate);
        const dayName = daysMap[dateObj.getDay()];

        const agentData = sheetDataCache.find(row => row.name === selectedName);
        if (agentData && agentData[dayName]) {
            const optionVal = agentData[dayName];
            
            // Highlight/select matching category chip if it exists
            const checkbox = document.querySelector(`input[name="category"][value="${optionVal}"]`);
            if (checkbox) {
                document.querySelectorAll('input[name="category"]').forEach(cb => cb.checked = false);
                checkbox.checked = true;
            }
            
            // Set status input field with value from cell
            document.getElementById('statusInput').value = optionVal;
        }
    }

    agentSelect.addEventListener('change', updateSelectedOption);
    dateInput.addEventListener('change', updateSelectedOption);

    form.onsubmit = async (e) => {
        e.preventDefault();
        
        btn.disabled = true;
        btn.innerText = 'שולח...';
        statusMsg.style.display = 'none';
        
        const rawDate = dateInput.value;
        let formattedDate = "";
        if (rawDate) {
            const d = new Date(rawDate);
            formattedDate = d.getDate() + '/' + (d.getMonth() + 1);
        }

        const selectedCategories = Array.from(document.querySelectorAll('input[name="category"]:checked'))
            .map(cb => cb.value).join(', ');

        const data = {
            date: formattedDate,
            agentName: agentSelect.value,
            category: selectedCategories,
            description: document.getElementById('description').value,
            link: document.getElementById('link').value,
            status: document.getElementById('statusInput').value
        };

        try {
            await fetch(scriptURL, { 
                method: 'POST', 
                mode: 'no-cors', 
                cache: 'no-cache',
                body: JSON.stringify(data) 
            });

            statusMsg.style.display = 'block';
            statusMsg.style.color = '#166534';
            statusMsg.style.backgroundColor = '#dcfce7';
            statusMsg.innerText = '✓ נשלח בהצלחה לגיליון!';
            
            form.reset();
            dateInput.valueAsDate = new Date();
        } catch (error) {
            statusMsg.style.display = 'block';
            statusMsg.style.color = '#991b1b';
            statusMsg.style.backgroundColor = '#fee2e2';
            statusMsg.innerText = 'שגיאה בשליחה';
        } finally {
            btn.disabled = false;
            btn.innerText = 'שלח עדכון';
        }
    };

    // Load data on page init
    loadSheetData();
</script>

</body>
</html>
